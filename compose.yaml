name: acervo

services:
  acervo:
    build:
      context: .
    image: acervo:cloud
    restart: unless-stopped
    init: true
    environment:
      ACERVO_MODE: cloud
      ACERVO_PUBLIC_ORIGIN: https://${ACERVO_DOMAIN:?Configure ACERVO_DOMAIN em deploy/cloud.env}
      ACERVO_ADMIN_PASSWORD: ${ACERVO_ADMIN_PASSWORD:?Configure uma senha de pelo menos 16 caracteres}
      ACERVO_DATA_DIR: /app/data
      ACERVO_HOST: 0.0.0.0
      PORT: "4310"
    volumes:
      - acervo_data:/app/data
    tmpfs:
      - /tmp:mode=1777,size=256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "4310"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      acervo:
        condition: service_healthy
    environment:
      ACERVO_DOMAIN: ${ACERVO_DOMAIN:?Configure ACERVO_DOMAIN em deploy/cloud.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777,size=32m
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  acervo_data:
  caddy_data:
  caddy_config:
