<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acervo — sua música, do seu jeito</title>
<meta name="description" content="Sua biblioteca de música. Ouça suas favoritas e descubra o que vem a seguir com uma rádio feita para você.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acervo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=9">
<link rel="stylesheet" href="/mobile.css?v=10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231ed760'/%3E%3Cpath d='M8 13v6M12 9v14M16 11v10M20 7v18M24 13v6' stroke='%23111' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link" href="#view">Pular para o conteúdo</a>
<div class="app">
  <header class="topbar">
    <button class="icon-btn only-mobile" data-action="menu" aria-label="Abrir menu" data-ico="menu"></button>
    <button class="brand" data-action="nav" data-view="home" aria-label="Acervo, início">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="34" height="34"><circle cx="16" cy="16" r="16" fill="currentColor"/><path d="M8 14v4M12 10v12M16 12v8M20 8v16M24 14v4" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-word">acervo</span>
    </button>
    <div class="topbar-center">
      <button class="home-button" data-action="nav" data-view="home" aria-label="Início" title="Início" data-ico="home"></button>
      <form class="search-form" id="search-form" role="search">
        <span class="search-ico" data-ico="search"></span>
        <input id="search-input" type="search" placeholder="O que você quer ouvir?" autocomplete="off" aria-label="Buscar músicas no YouTube">
        <button class="search-submit" type="submit" aria-label="Buscar músicas" title="Buscar músicas"><span data-ico="arrow"></span></button>
      </form>
    </div>
    <div class="topbar-actions">
      <span class="conn" id="conn"><span class="conn-dot"></span><span id="conn-text">acervo local</span></span>
      <span class="device-banner" id="device-status" hidden aria-live="polite"></span>
      <button class="icon-btn connect-trigger" data-action="connect-devices" aria-label="Conectar dispositivos" title="Conectar dispositivos">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="13" height="11" rx="1.5"/><path d="M6 20h7M9.5 15v5"/><rect x="16" y="10" width="5" height="10" rx="1.2"/></svg>
      </button>
      <button class="btn btn-light topbar-add" data-action="open-download" aria-label="Adicionar música">
        <span data-ico="download"></span><span class="button-label">Adicionar música</span>
      </button>
      <button class="icon-btn settings-trigger" data-action="nav" data-view="settings" title="Configurações" aria-label="Configurações" data-ico="settings"></button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Sua biblioteca e navegação">
    <div class="library-heading">
      <button class="library-title" data-action="nav" data-view="library"><span data-ico="library"></span>Sua biblioteca</button>
      <button class="icon-btn library-add" data-action="open-download" aria-label="Adicionar música à biblioteca" title="Adicionar música"><span aria-hidden="true">+</span></button>
    </div>
    <nav class="nav" aria-label="Navegação">
      <button class="nav-item is-active" data-action="nav" data-view="home"><span class="nav-ico" data-ico="home"></span><span>Início</span></button>
      <button class="nav-item" data-action="nav" data-view="search"><span class="nav-ico" data-ico="search"></span><span>Buscar</span></button>
      <button class="nav-item" data-action="nav" data-view="recommended"><span class="nav-ico" data-ico="sparkles"></span><span>Recomendadas</span></button>
      <button class="nav-item" data-action="nav" data-view="radio" title="Sua rádio"><span class="nav-ico" data-ico="radio"></span><span>Rádio</span></button>
      <button class="nav-item" data-action="nav" data-view="library"><span class="nav-ico" data-ico="library"></span><span>Músicas</span></button>
      <button class="nav-item" data-action="nav" data-view="playlists"><span class="nav-ico" data-ico="queue"></span><span>Playlists</span></button>
    </nav>
    <div class="library-sort"><span>Seu acervo</span><span>Recentes <span data-ico="queue"></span></span></div>
    <div class="sidebar-tracks" id="sidebar-tracks"></div>
    <div class="sidebar-foot">
      <div class="library-summary"><span><strong id="stat-tracks">0</strong> músicas</span><span aria-hidden="true">·</span><span id="stat-hours">0h</span></div>
      <span class="hide" aria-hidden="true"><span id="stat-artists">0</span><span id="stat-lufs">—</span></span>
      <button class="side-link" data-action="switch-version"><span data-ico="device"></span>Trocar versão</button>
      <button class="side-link" data-action="save-all-offline" id="save-all-link" hidden><span data-ico="download"></span>Salvar biblioteca no celular</button>
      <button class="side-link" data-action="open-offline" id="offline-link" hidden><span data-ico="phone"></span>Ouvir offline</button>
    </div>
  </aside>

  <div class="content">
    <main class="main" id="view" tabindex="-1"></main>
  </div>
</div>

<footer class="player" id="player" aria-label="Reprodutor">
  <div class="player-now">
    <button class="player-cover" id="player-cover" data-action="expand-player" aria-label="Abrir música em reprodução"><span class="player-cover-fallback"></span></button>
    <div class="player-meta">
      <button class="player-title" id="player-title" data-action="expand-player" aria-label="Abrir reprodutor">Nada tocando</button>
      <button class="player-artist artist-link" id="player-artist" data-action="open-artist" disabled>Escolha uma faixa do acervo</button>
    </div>
    <button class="icon-btn player-radio" data-action="radio-current" aria-label="Rádio desta faixa" title="Rádio desta faixa" data-ico="radio"></button>
    <button class="icon-btn player-timer" data-action="sleep" aria-label="Timer de sono" title="Timer de sono" data-ico="moon"></button>
    <button class="icon-btn player-connect connect-trigger" data-action="connect-devices" aria-label="Dispositivos disponíveis" title="Dispositivos disponíveis">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="13" height="11" rx="1.5"/><path d="M6 20h7M9.5 15v5"/><rect x="16" y="10" width="5" height="10" rx="1.2"/></svg>
    </button>
  </div>

  <div class="player-main">
    <div class="player-controls">
      <button class="icon-btn" data-action="shuffle" id="btn-shuffle" aria-label="Aleatório" title="Aleatório" data-ico="shuffle"></button>
      <button class="icon-btn" data-action="prev" aria-label="Anterior" data-ico="prev"></button>
      <button class="play-btn" data-action="toggle" id="btn-play" aria-label="Tocar" data-ico="play"></button>
      <button class="icon-btn" data-action="next" aria-label="Próxima" data-ico="next"></button>
      <button class="icon-btn" data-action="repeat" id="btn-repeat" aria-label="Repetir" title="Repetir" data-ico="repeat"></button>
    </div>
    <div class="player-progress">
      <span class="time" id="time-current">0:00</span>
      <div class="bar" id="progress" role="slider" tabindex="0" aria-label="Progresso da faixa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar-fill" id="progress-fill"></div>
        <div class="bar-thumb" id="progress-thumb"></div>
      </div>
      <span class="time" id="time-total">0:00</span>
    </div>
  </div>

  <div class="player-extra">
    <span class="player-eq" id="player-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <button class="icon-btn player-timer" data-action="sleep" aria-label="Timer de sono" title="Timer de sono" data-ico="moon"></button>
    <button class="icon-btn" data-action="queue" aria-label="Fila" title="Fila" data-ico="queue"></button>
    <button class="icon-btn connect-trigger" data-action="connect-devices" aria-label="Dispositivos disponíveis" title="Dispositivos disponíveis" data-ico="device"></button>
    <button class="icon-btn" data-action="mute" id="btn-mute" aria-label="Silenciar" data-ico="volume"></button>
    <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
  </div>
</footer>

<nav class="mobile-nav" aria-label="Navegação principal">
  <button class="mobile-nav-item is-active" data-action="nav" data-view="home" aria-current="page"><span data-ico="home" aria-hidden="true"></span><span>Início</span></button>
  <button class="mobile-nav-item" data-action="nav" data-view="search"><span data-ico="search" aria-hidden="true"></span><span>Buscar</span></button>
  <button class="mobile-nav-item" data-action="nav" data-view="library"><span data-ico="library" aria-hidden="true"></span><span>Biblioteca</span></button>
  <button class="mobile-nav-item" data-action="nav" data-view="radio"><span data-ico="radio" aria-hidden="true"></span><span>Rádio</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div id="modal-root"></div>
<div id="queue-root"></div>
<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<audio id="audio" preload="metadata"></audio>
<script src="/app.js?v=9" defer></script>
<script src="/radio.js?v=8" defer></script>
<script src="/connect.js?v=10" defer></script>
<script src="/explore.js?v=9" defer></script>
<script src="/views.js?v=10" defer></script>
</body>
</html>
