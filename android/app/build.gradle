plugins { id 'com.android.application' }

android {
    namespace 'br.com.acervo.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.acervo.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] } }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}

tasks.register('writeExtractorClasspath') {
    doLast {
        def jars = configurations.releaseRuntimeClasspath.resolve().findAll { it.name.endsWith('.jar') }
        def destination = file("${buildDir}/extractor-classpath.txt")
        destination.parentFile.mkdirs()
        destination.text = jars.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
