plugins { id 'com.android.application' }

android {
    namespace 'br.com.acervo.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.acervo.app'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '1.6.1'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] } }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}

// Direct Gradle builds and the Windows staged build use the same web sources.
def sharedWeb = rootProject.file('../public')
if (sharedWeb.isDirectory()) {
    def bundledWeb = layout.buildDirectory.dir('generated/shared-web')
    android.sourceSets.main.assets.srcDir(bundledWeb)
    tasks.register('bundleSharedWeb', Sync) {
        from(sharedWeb) { include 'index.html', 'app.js', 'views.js', 'connect.js', 'radio.js', 'explore.js', 'styles.css', 'mobile.css', 'icon.svg', 'manifest.webmanifest' }
        into(bundledWeb.map { it.dir('web') })
    }
    tasks.named('preBuild').configure { dependsOn 'bundleSharedWeb' }
}

tasks.register('writeExtractorClasspath') {
    doLast {
        def jars = configurations.releaseRuntimeClasspath.resolve().findAll { it.name.endsWith('.jar') }
        def destination = file("${buildDir}/extractor-classpath.txt")
        destination.parentFile.mkdirs()
        destination.text = jars.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
